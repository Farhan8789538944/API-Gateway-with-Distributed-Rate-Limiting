# Test / benchmark override. ALWAYS use with a separate project name so it has
# its own containers, network and volumes:
#   docker compose -p apigw-test -f compose.yaml -f compose.test.yaml up -d --build --wait
# (scripts/test_stack.ps1 wraps this.)
#
# Differences from the normal deployment, all explicit:
#   * internal services are published on 127.0.0.1 (distinct ports) so host
#     tests can reach PostgreSQL, Redis, each backend and each gateway directly;
#   * development fault controls (/_dev/faults) are enabled on the backends;
#   * instance headers are exposed and health probing is faster.
services:
  postgres:
    ports: ["127.0.0.1:15432:5432"]
  redis:
    ports: ["127.0.0.1:16379:6379"]
  product-1:
    ports: ["127.0.0.1:18081:8000"]
    environment: { DEV_CONTROLS_ENABLED: "true", EXPOSE_INSTANCE_HEADERS: "true" }
  product-2:
    ports: ["127.0.0.1:18082:8000"]
    environment: { DEV_CONTROLS_ENABLED: "true", EXPOSE_INSTANCE_HEADERS: "true" }
  orders:
    ports: ["127.0.0.1:18083:8000"]
    environment: { DEV_CONTROLS_ENABLED: "true", EXPOSE_INSTANCE_HEADERS: "true" }
  gateway-1:
    ports: ["127.0.0.1:18001:8000", "127.0.0.1:19101:9100"]
    environment: &gw-test-env
      EXPOSE_INSTANCE_HEADERS: "true"
      HEALTH_INTERVAL_S: "0.5"
  gateway-2:
    ports: ["127.0.0.1:18002:8000", "127.0.0.1:19102:9100"]
    environment: *gw-test-env
  nginx:
    ports: !override ["127.0.0.1:18080:80"]
