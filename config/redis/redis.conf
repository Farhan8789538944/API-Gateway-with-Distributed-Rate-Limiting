# Redis for quota state. Single instance: NOT highly available (documented).
# Note: redis.conf does not support inline comments.

# Reachable only on the private Compose network (not published normally).
bind 0.0.0.0
protected-mode no
port 6379

# Never silently evict quota keys: when memory is full, writes fail with OOM
# and the gateway fails closed (503) instead of resetting someone's quota.
maxmemory 128mb
maxmemory-policy noeviction

# Explicit persistence: append-only file, fsync once per second.
# A crash can lose up to ~1 s of quota mutations (quotas may partially reset).
appendonly yes
appendfsync everysec
# No RDB snapshots; AOF is the persistence mechanism.
save ""

# Bound slow scripts; ours run in microseconds.
busy-reply-threshold 1000
timeout 0
tcp-keepalive 60
