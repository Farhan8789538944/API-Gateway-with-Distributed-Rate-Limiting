# Nginx Open Source entry point: balances across the two gateway instances.
worker_processes 1;
events { worker_connections 1024; }

http {
    access_log /dev/stdout;
    error_log  /dev/stderr warn;
    server_tokens off;

    # Docker's embedded DNS; `resolve` below re-resolves gateway names, so a
    # recreated gateway container (new IP) is picked up without an Nginx restart.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Generate a request id when the client did not send one. The gateway
    # validates it and replaces anything malformed.
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    upstream gateways {
        zone gateways 64k;
        # Passive failure handling (Nginx OSS has no active health checks):
        # after 2 failed attempts within 5 s an instance is skipped for 5 s.
        server gateway-1:8000 resolve max_fails=2 fail_timeout=5s;
        server gateway-2:8000 resolve max_fails=2 fail_timeout=5s;
        keepalive 32;
        keepalive_timeout 4s;   # below the gateways' Uvicorn keep-alive (5 s)
    }

    server {
        listen 80;

        # Request bounds enforced here first (before the gateway sees anything).
        client_max_body_size     64k;   # 413 for larger Content-Length or chunked bodies
        client_body_buffer_size  64k;   # keep bounded bodies in memory (no temp files)
        client_body_timeout      5s;    # slow body upload -> 408
        client_header_timeout    5s;
        large_client_header_buffers 4 8k;
        send_timeout             10s;

        location = /nginx-health { access_log off; default_type text/plain; return 200 "ok\n"; }

        # Gateway health endpoints are for internal probes only.
        location ^~ /health/ {
            default_type application/json;
            return 404 '{"error":{"code":"route_not_found","message":"no gateway route matches this path"}}';
        }

        location / {
            proxy_pass http://gateways;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $req_id;
            # Overwrite (not append) client-supplied forwarding headers.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            # NEVER replay a request on another gateway: the first gateway may
            # already have consumed quota or created an order. A failure is
            # returned to the client (502/504) and counted for max_fails.
            proxy_next_upstream off;

            proxy_connect_timeout 1s;
            proxy_send_timeout    5s;
            # Longer than the gateway's 5 s upstream deadline so the gateway's
            # own 504 (with request id) normally wins.
            proxy_read_timeout    10s;

            proxy_request_buffering on;   # absorb slow client bodies here
            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 8 16k;
            proxy_max_temp_file_size 0;   # responses are bounded; never spill to disk
        }
    }
}
