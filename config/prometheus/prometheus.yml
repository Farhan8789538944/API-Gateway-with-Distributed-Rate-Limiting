global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  # Each gateway is scraped separately on its internal metrics port (not
  # reachable through Nginx). Aggregate across instances with sum() in PromQL.
  - job_name: gateway
    static_configs:
      - targets: ["gateway-1:9100"]
        labels: { gateway: gateway-1 }
      - targets: ["gateway-2:9100"]
        labels: { gateway: gateway-2 }
